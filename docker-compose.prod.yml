# Example production stack on a single server: app + MySQL 8.
#   1. cp server/.env.example .env.production and fill it in (DATABASE_URL is set below)
#   2. docker compose -f docker-compose.prod.yml up -d --build
# Put a TLS proxy (Caddy, nginx, or the host's load balancer) in front of port 4000. Webhooks need HTTPS.
services:
  app:
    build:
      context: .
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    env_file: .env.production
    environment:
      DATABASE_URL: mysql://bliss:${MYSQL_PASSWORD:?set MYSQL_PASSWORD}@db:3306/bliss
      BACKUP_DIR: /data/backups
    ports: ["4000:4000"]
    volumes: [appdata:/data]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_USER: bliss
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_DATABASE: bliss
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ubliss -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  mysqldata:
  appdata:
