name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env: { MARIADB_USER: bliss, MARIADB_PASSWORD: bliss, MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: bliss }
        ports: ["3306:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 20
    steps:
      - name: Let the test user create the test database
        run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'bliss'@'%'; FLUSH PRIVILEGES;"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: mysql://bliss:bliss@127.0.0.1:3306/bliss_test
