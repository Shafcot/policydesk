name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: policydesk, POSTGRES_PASSWORD: policydesk, POSTGRES_DB: policydesk }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U policydesk" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://policydesk:policydesk@127.0.0.1:5432/policydesk_test
