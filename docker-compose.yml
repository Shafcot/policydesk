# Local development services (MySQL 8 + Redis). Production runs on the client's cPanel; see DEPLOY.md.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_USER: bliss
      MYSQL_PASSWORD: bliss
      MYSQL_DATABASE: bliss
      MYSQL_ROOT_PASSWORD: bliss-root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["3306:3306"]
    volumes: [mysqldata:/var/lib/mysql]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  mysqldata:
